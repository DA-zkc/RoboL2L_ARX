[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robol2l-arx"
version = "0.1.0"
description = "ARX X5 physical deployment: CaP, Runtime, adapters, RGB-D and perception services"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12", "requests>=2.32", "PyYAML>=6"]

[project.scripts]
franka-player = "franka_player.server:main"
franka-cap = "franka_cap.cli:main"
robol2l-cap = "robol2l_deploy.cap.cli:main"

[tool.setuptools.packages.find]
include = ["franka_player*", "franka_cap*", "robol2l_deploy*", "cap_harness*"]

[tool.setuptools.package-data]
franka_player = ["web/*"]
franka_cap = ["models/*.urdf", "models/*.srdf", "models/*.json", "models/LICENSE", "models/meshes/*.stl"]

cap_harness = ["UPSTREAM.json", "LICENSE", "NOTICE"]
robol2l_deploy = ["provenance.json", "UPSTREAM-LICENSE*", "web/*", "models/arx-x5-2023-gripper/*", "models/arx-x5-2023-gripper/meshes/*.STL", "models/arx-x5-2023-payload/*"]

[project.optional-dependencies]
cap = ["numpy==2.2.6", "scipy>=1.14,<2", "opencv-python==4.11.0.86", "pybullet==3.2.7", "matplotlib>=3.9,<4"]
arx = ["pyorbbecsdk2==2.1.3", "opencv-python==4.11.0.86", "python-can>=4.0", "pin", "ruckig"]
